name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run eval
      # Runs without DATABASE_URL on purpose: the build must never require secrets.
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The harness that opens pull requests is held to the same bar as the code it writes.
      - run: shellcheck -x -S warning agent/init.sh agent/local/*.sh agent/local/providers/*.sh scripts/*.sh
      - run: for f in agent/init.sh agent/local/*.sh agent/local/providers/*.sh scripts/*.sh; do bash -n "$f"; done
